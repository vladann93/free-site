<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Smart Bike Key</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a 80%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px;
    }

    header {
      width: 100%;
      text-align: center;
      margin-top: 10px;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .dot.busy {
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .controls-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: auto 0;
    }

    .btn {
      position: relative;
      width: 100%;
      height: 110px;
      border: none;
      border-radius: 24px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s ease, filter 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(0.8);
      transform: none;
    }

    .btn-start {
      background: linear-gradient(135deg, #059669, #10b981);
      border: 1px solid rgba(52, 211, 153, 0.3);
      box-shadow: 0 12px 30px -5px rgba(16, 185, 129, 0.4);
    }

    .btn-start:not(:disabled):hover {
      box-shadow: 0 16px 35px -5px rgba(16, 185, 129, 0.6);
    }

    .btn-lock {
      background: linear-gradient(135deg, #dc2626, #ef4444);
      border: 1px solid rgba(248, 113, 113, 0.3);
      box-shadow: 0 12px 30px -5px rgba(239, 68, 68, 0.4);
    }

    .btn-lock:not(:disabled):hover {
      box-shadow: 0 16px 35px -5px rgba(239, 68, 68, 0.6);
    }

    .btn-connect {
      height: 60px;
      border-radius: 16px;
      background: #334155;
      font-size: 16px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    .sub-text {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.85;
    }

    .bike-state-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px 18px;
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    .state-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
    }

    .state-value {
      font-size: 20px;
      font-weight: 800;
      margin-top: 4px;
      color: #f8fafc;
    }

    footer {
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">⚡ Smart Bike Key</div>
    <div class="status-badge" id="statusBadge">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Disconnected</span>
    </div>
  </header>

  <div class="controls-container">
    <div class="bike-state-card">
      <div class="state-title">Bike Status</div>
      <div class="state-value" id="bikeStateDisplay">LOCKED</div>
    </div>

    <!-- START / TURN ON BUTTON -->
    <button class="btn btn-start" id="btnStart" disabled>
      <span>⚡ TURN ON BIKE</span>
      <span class="sub-text">7 Pulses (300ms)</span>
    </button>

    <!-- LOCK BUTTON -->
    <button class="btn btn-lock" id="btnLock" disabled>
      <span>🔒 LOCK BIKE</span>
      <span class="sub-text">3 Pulses (300ms)</span>
    </button>

    <!-- CONNECT / RECONNECT BUTTON -->
    <button class="btn btn-connect" id="btnConnect">
      🔗 Connect to SmartBike
    </button>
  </div>

  <footer>
    Direct Web Bluetooth &bull; No Wi-Fi &bull; 100% Offline
  </footer>

  <script>
    const SERVICE_UUID        = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHAR_COMMAND_UUID   = "19b10001-e8f2-537e-4f6c-d104768a1214";
    const CHAR_STATUS_UUID    = "19b10002-e8f2-537e-4f6c-d104768a1214";

    let bleDevice = null;
    let cmdCharacteristic = null;
    let statusCharacteristic = null;

    const btnConnect = document.getElementById("btnConnect");
    const btnStart = document.getElementById("btnStart");
    const btnLock = document.getElementById("btnLock");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const bikeStateDisplay = document.getElementById("bikeStateDisplay");

    function vibrate(ms = 60) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function setUiState(connected, busy = false, busyText = "") {
      if (busy) {
        statusDot.className = "dot busy";
        statusText.innerText = busyText || "Executing...";
        btnStart.disabled = true;
        btnLock.disabled = true;
      } else if (connected) {
        statusDot.className = "dot connected";
        statusText.innerText = "Connected";
        btnConnect.innerText = "✔ Connected to SmartBike";
        btnConnect.style.background = "#1e293b";
        btnStart.disabled = false;
        btnLock.disabled = false;
      } else {
        statusDot.className = "dot";
        statusText.innerText = "Disconnected";
        btnConnect.innerText = "🔗 Connect to SmartBike";
        btnConnect.style.background = "#334155";
        btnStart.disabled = true;
        btnLock.disabled = true;
      }
    }

    async function connectBle() {
      try {
        vibrate(40);
        setUiState(false, true, "Scanning...");

        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "SmartBike" }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        setUiState(false, true, "Connecting...");
        const server = await bleDevice.gatt.connect();

        const service = await server.getPrimaryService(SERVICE_UUID);
        cmdCharacteristic = await service.getCharacteristic(CHAR_COMMAND_UUID);
        
        try {
          statusCharacteristic = await service.getCharacteristic(CHAR_STATUS_UUID);
          await statusCharacteristic.startNotifications();
          statusCharacteristic.addEventListener('characteristicvaluechanged', (e) => {
            const dec = new TextDecoder().decode(e.target.value);
            bikeStateDisplay.innerText = dec;
          });
          const val = await statusCharacteristic.readValue();
          bikeStateDisplay.innerText = new TextDecoder().decode(val);
        } catch(e) {
          console.warn("Status char unavailable:", e);
        }

        vibrate([50, 50, 50]);
        setUiState(true);

      } catch (err) {
        console.error("BLE Connect failed:", err);
        setUiState(false);
      }
    }

    function onDisconnected() {
      vibrate(100);
      setUiState(false);
    }

    async function sendCommand(cmd, actionName, expectedState, durationMs) {
      if (!cmdCharacteristic) return;
      try {
        vibrate(80);
        setUiState(true, true, `Pulsing ${actionName}...`);

        const encoder = new TextEncoder();
        await cmdCharacteristic.writeValue(encoder.encode(cmd));

        bikeStateDisplay.innerText = expectedState;

        // Visual lock during actuation pulses
        setTimeout(() => {
          setUiState(true);
        }, durationMs);

      } catch (err) {
        console.error("Failed to send command:", err);
        setUiState(true);
      }
    }

    btnConnect.addEventListener("click", connectBle);

    // 7 pulses * (300ms + 300ms) = ~4.2s
    btnStart.addEventListener("click", () => {
      sendCommand("1", "Turn On", "UNLOCKED", 4200);
    });

    // 3 pulses * (300ms + 300ms) = ~1.8s
    btnLock.addEventListener("click", () => {
      sendCommand("2", "Lock", "LOCKED", 1800);
    });
  </script>
</body>
</html>
